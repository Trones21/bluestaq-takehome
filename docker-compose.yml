# Local development and test stack.
#
# In production these become RDS Postgres and real S3; the only deltas are a
# connection string and an S3 endpoint, which is the whole reason storage sits
# behind an interface.

name: notes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
      POSTGRES_DB: notes
    ports:
      - "5433:5432" # 5433 on the host to avoid colliding with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -U and -d matter: the default checks the "postgres" database as the
      # "root" user and passes before ours is actually usable.
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 3s
      retries: 15

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001" # web console, handy for seeing what actually got uploaded
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 15

  # One-shot: creates the bucket, then exits. The API refuses to start without
  # it, so this must succeed before the API comes up.
  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/notes-attachments &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  miniodata:
