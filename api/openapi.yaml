# Hand-written, and the source of truth.
#
# Generating it from handler annotations makes the implementation the contract:
# whatever the code happens to do becomes what the API "promises", so a
# regression regenerates into the spec and the document can never disagree with
# the bug. Written by hand, this is a statement of intent that the tests and
# the flows check the implementation against.

openapi: 3.1.0

info:
  title: Notes API
  version: "1.0.0"
  description: |
    A note-taking service shared amongst several small teams.

    **A note has no home team.** It belongs to its owner; teams are only ever
    grantees. "Team note" means a note with one team grant, and a note shared
    across two teams is simply two grants. This is why cross-team sharing needs
    no schema change, and why a note with no grants is private.

    ### Two behaviours worth knowing before you start

    **404, not 403.** If you cannot read a note at all, the API reports it as
    absent. A 403 would confirm the note exists, turning ID enumeration into a
    way to learn about other teams' data. 403 appears only when you *can* see
    the resource but lack the role for that particular action.

    **Writes require `If-Match`.** Every note read returns an `ETag` carrying
    the version. Send it back on `PATCH`. A stale version gets `409` with the
    current representation in the body, so you can show a diff instead of an
    error; a missing header gets `428`. This exists because two people editing
    one note is the normal case here, and last-write-wins destroys work
    silently.

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: auth
    description: Registration and login
  - name: users
    description: Your own account, and finding people to share with
  - name: teams
    description: Teams and membership
  - name: notes
    description: Notes, search, sharing and attachments

security:
  - bearerAuth: []

paths:
  /v1/auth/register:
    post:
      tags: [auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, display_name]
              properties:
                email: { type: string, format: email }
                password:
                  type: string
                  minLength: 12
                  maxLength: 72
                  description: >
                    At least 12 characters. Capped at 72 *bytes* because bcrypt
                    ignores anything beyond that, which would make two long
                    passwords sharing a prefix interchangeable.
                display_name: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Account created, with a token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409":
          description: >
            An account with that email exists. Matching is case-insensitive,
            so Alice@ and alice@ are the same account.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for a token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401":
          description: >
            Invalid credentials. Deliberately identical for a wrong password
            and an unknown account, and the two take the same time, so this
            endpoint cannot be used to discover which addresses are registered.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/users/me:
    get:
      tags: [users]
      summary: Your account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
    patch:
      tags: [users]
      summary: Update your profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, maxLength: 128 }
                email: { type: string, format: email }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [users]
      summary: Delete your account
      description: |
        Soft delete. **Your notes survive** — in a shared service they are not
        only yours, and removing them would destroy other people's working
        context. You render as a tombstone owner instead.

        This is self-service deletion only. Offboarding someone who left the
        company wants ownership *transfer*, which is out of scope for a
        structural reason: the model has team admins but no org admin.
      responses:
        "204": { description: Account soft-deleted }

  /v1/users/me/password:
    post:
      tags: [users]
      summary: Change your password
      description: >
        Requires the current password, so a stolen token cannot be escalated
        into permanent account takeover. Existing tokens stay valid until they
        expire — revocation would need a token store, which this build does not
        have.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string, minLength: 12, maxLength: 72 }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { description: The current password was wrong }

  /v1/users:
    get:
      tags: [users]
      summary: Find someone to share with
      description: |
        **Exact email only**, and scoped to people who share a team with you.
        A prefix or fuzzy directory is a data-harvesting surface, and closing
        enumeration costs nothing at design time.

        Returns 404 both for an unregistered address and for someone outside
        your teams — distinguishing them would rebuild the directory this
        deliberately is not.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams:
    get:
      tags: [teams]
      summary: Teams you belong to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  teams:
                    type: array
                    items: { $ref: "#/components/schemas/Team" }
    post:
      tags: [teams]
      summary: Create a team
      description: You become its first admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /v1/teams/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [teams]
      summary: Get a team
      description: >
        Non-members get 404, not 403 — team names leak organisational
        structure, so existence is concealed the same way note existence is.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [teams]
      summary: Rename a team (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Team" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [teams]
      summary: Delete a team (admin only)
      description: >
        Notes are untouched — they belong to their owners, and a team is only a
        grantee. The team's share grants are removed in the same transaction,
        because `principal_id` has no foreign key and nothing cascades; an
        orphaned grant would resolve against a reused UUID.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/teams/{id}/members:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [teams]
      summary: List members
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [teams]
      summary: Add a member, or change their role (admin only)
      description: >
        Adding an existing member updates their role, so this doubles as
        promote/demote. Demoting the last admin is refused, as is removing
        them — a team with no admins can never be managed again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
                role:
                  type: string
                  enum: [member, admin]
                  default: member
                  description: >
                    Governs team management only. A team admin is **not**
                    automatically an editor of notes shared with the team.
      responses:
        "204": { description: Added or updated }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such team, or no such user }
        "409": { description: This would leave the team with no admin }

  /v1/teams/{id}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [teams]
      summary: Remove a member (admin only)
      description: >
        Their note access via this team ends immediately, with nothing to clean
        up: the grant is to the team, so they simply stop matching it.
      responses:
        "204": { description: Removed }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: This would leave the team with no admin }

  /v1/teams/{id}/leave:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [teams]
      summary: Leave a team
      responses:
        "204": { description: Left }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: You are the last admin }

  /v1/notes:
    get:
      tags: [notes]
      summary: List and search notes
      description: |
        **Every filter narrows the set you can already read.** `?owner=bob`
        returns Bob's notes *you can already see*, never all of Bob's. A filter
        is always an additional AND, never a new way in.

        Pagination is keyset, not offset: offset skips and duplicates rows
        whenever a concurrent insert shifts the window, which on a
        recency-ordered feed is constant. Pass `next_cursor` back as `cursor`.

        Note that keyset removes offset drift but does not make the scan a
        snapshot — a note edited mid-pagination changes its sort key and can
        still be seen twice or missed. That is acceptable for a feed.
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: >
            Full-text over title and body, with the title weighted higher.
            Accepts quoted phrases, OR, and leading minus.
        - name: tag
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
          description: Repeatable, with AND semantics.
        - name: owner
          in: query
          schema: { type: string }
          description: A user UUID, or `me`.
        - name: team
          in: query
          schema: { type: string, format: uuid }
          description: Notes shared with this team. Requires membership.
        - name: shared_with_me
          in: query
          schema: { type: boolean }
          description: Excludes notes you own.
        - name: deleted
          in: query
          schema: { type: boolean }
          description: >
            Your soft-deleted notes. Owner-scoped — a deleted note stays
            invisible to everyone it was shared with.
        - name: limit
          in: query
          schema: { type: integer, default: 25, maximum: 100 }
          description: Clamped rather than rejected when too large.
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: A page of notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items: { $ref: "#/components/schemas/NoteListItem" }
                  next_cursor: { type: string }
                  has_more: { type: boolean }
        "400": { $ref: "#/components/responses/ValidationError" }
    post:
      tags: [notes]
      summary: Create a note
      responses:
        "201":
          description: Created. The `ETag` header carries the version.
          headers:
            ETag: { schema: { type: string }, description: 'Version, e.g. "1"' }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/ValidationError" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 512 }
                body:
                  type: string
                  description: >
                    Markdown. A new note cannot reference attachments — create
                    it, upload, then edit the body.
                tags:
                  type: array
                  items: { type: string, maxLength: 64 }
                  maxItems: 32
                  description: Lowercased, trimmed and de-duplicated.

  /v1/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [notes]
      summary: Get a note
      responses:
        "200":
          description: OK
          headers:
            ETag:
              schema: { type: string }
              description: Send this back as `If-Match` when you write.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [notes]
      summary: Update a note (editor)
      description: |
        Partial update. `If-Match` is **required** — optional would mean the
        careless client, the one most likely to clobber someone, is exactly the
        one that skips the check. `If-Match: *` is refused for the same reason:
        it means "any version".
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
          description: The version from the last read, quoted or bare.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 512 }
                body:
                  type: string
                  description: >
                    Reference attachments as `![alt](attachment:{uuid})`. They
                    must exist, be ready, and belong to this note. Never paste a
                    presigned URL into a body — it expires, and the note would
                    rot.
                tags: { type: array, items: { type: string } }
      responses:
        "200":
          description: Updated
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            Someone else wrote first. The body carries the current
            representation under `conflict`, so you can show a diff.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "428":
          description: No `If-Match` header. The request is well-formed; it just
            refuses to proceed unconditionally.
    delete:
      tags: [notes]
      summary: Delete a note (owner only)
      description: Soft delete. It disappears for everyone, and the owner can restore it.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/notes/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/PathID"
    post:
      tags: [notes]
      summary: Restore a deleted note (owner only)
      description: >
        Owner-only, matching delete — an editor undoing an owner's deletion
        would be surprising.
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The note is not deleted }

  /v1/notes/{id}/shares:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [notes]
      summary: Who can see this note
      description: >
        Viewer-level, not owner-only: knowing who can read your note matters
        more than hiding the list from people already on it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  shares:
                    type: array
                    items: { $ref: "#/components/schemas/Share" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [notes]
      summary: Grant or change access (owner only)
      description: >
        Editors deliberately cannot re-share. Re-sharing rights are the usual
        source of accidental exposure, and owner-only keeps the access graph
        one hop deep. You may only share with a team you belong to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal_type, principal_id, role]
              properties:
                principal_type: { type: string, enum: [user, team] }
                principal_id: { type: string, format: uuid }
                role:
                  type: string
                  enum: [viewer, editor]
                  description: >
                    `owner` is not grantable — it comes from the note itself.
      responses:
        "204": { description: Granted }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: No such note, user, or team you belong to }

  /v1/notes/{id}/shares/{principalType}/{principalId}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - name: principalType
        in: path
        required: true
        schema: { type: string, enum: [user, team] }
      - name: principalId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [notes]
      summary: Revoke access (owner only)
      responses:
        "204": { description: Revoked }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/notes/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [notes]
      summary: List attachments with fresh download URLs
      description: >
        URLs are minted per request and are short-lived. A leaked one stays
        valid until it expires, independent of a later revoke — that is the
        cost of not proxying bytes, bounded by the TTL.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items: { $ref: "#/components/schemas/Attachment" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [notes]
      summary: Start an upload (editor)
      description: |
        Step 1 of 2. Returns a presigned URL; `PUT` the bytes straight to it,
        then call `/complete`.

        Bytes never pass through this API — proxying them would put large
        uploads on the app server's request path and rule out a CDN.

        The declared `size_bytes` is checked here, but **a presigned PUT cannot
        enforce it** — the signature covers the method, key and expiry, not the
        body length. The real check happens at `/complete`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, mime_type, size_bytes]
              properties:
                filename: { type: string, maxLength: 255 }
                mime_type:
                  type: string
                  description: "Allowlisted: image/*, video/mp4, application/pdf"
                size_bytes: { type: integer, format: int64 }
      responses:
        "201":
          description: Upload reserved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Attachment"
                  - type: object
                    properties:
                      upload_url: { type: string }
                      instructions: { type: string }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/notes/{id}/attachments/{attachmentId}/complete:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/AttachmentID"
    post:
      tags: [notes]
      summary: Confirm an upload (editor)
      description: >
        Step 2 of 2. Verifies the object exists and is within the size cap,
        then records the size from the object itself rather than the client's
        claim. Idempotent.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "409": { description: Nothing was uploaded to the presigned URL }
        "413": { description: The uploaded object exceeds the size cap; it was discarded }

  /v1/notes/{id}/attachments/{attachmentId}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/AttachmentID"
    delete:
      tags: [notes]
      summary: Delete an attachment (editor)
      description: >
        Refused while the note body still references it — allowing it would
        leave a broken image in saved content.
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: The body still references this attachment }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentID:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    NotFound:
      description: >
        Not found — or you may not read it. The two are deliberately
        indistinguishable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: >
        You can see this resource but lack the role for this action. Its
        existence is not a secret from you, so this is a 403 rather than a 404.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: The request body failed validation
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Conflicts with the current state
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details. One error shape for the whole API.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          additionalProperties: { type: string }
          description: Field-level failures, on a 400.
        conflict:
          description: The current representation, on a 409 version conflict.

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        created_at: { type: string, format: date-time }
        deleted: { type: boolean }

    TokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
        user: { $ref: "#/components/schemas/User" }

    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        your_role: { type: string, enum: [member, admin] }

    Member:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { type: string, enum: [member, admin] }
        joined_at: { type: string, format: date-time }

    Note:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_user_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        tags: { type: array, items: { type: string } }
        version:
          type: integer
          description: Also returned as the `ETag`. Send it back as `If-Match`.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time }
        your_role:
          type: string
          enum: [viewer, editor, owner]
          description: >
            What you may do, so clients need not reimplement the rules and
            drift from them.

    NoteListItem:
      allOf:
        - $ref: "#/components/schemas/Note"
        - type: object
          properties:
            attachment_count:
              type: integer
              description: >
                A count, not URLs. Presigning is per-object, so embedding URLs
                would mean one signature per attachment per page.

    Share:
      type: object
      properties:
        principal_type: { type: string, enum: [user, team] }
        principal_id: { type: string, format: uuid }
        principal_name: { type: string }
        email: { type: string }
        role: { type: string, enum: [viewer, editor] }
        created_at: { type: string, format: date-time }

    Attachment:
      type: object
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        mime_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        status:
          type: string
          enum: [pending, ready]
          description: >
            `pending` until the upload is confirmed. Rows left pending are
            abandoned uploads, collected by `cmd/sweep`.
        created_at: { type: string, format: date-time }
        ready_at: { type: string, format: date-time }
        download_url:
          type: string
          description: Short-lived and minted per request. Never store it.
